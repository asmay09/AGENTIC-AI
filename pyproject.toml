[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asmay09", email = "137874375+asmay09@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "exa-py>=1.16.2",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-exa>=1.1.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.12.3",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
